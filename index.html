<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Laser Pro</title>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #27ae60;
            --bg: #f8f9fa;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding-bottom: 50px; }
        .container { max-width: 500px; margin: auto; background: white; min-height: 100vh; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        
        /* Abas */
        .tabs { display: flex; background: var(--primary); }
        .tab-btn { flex: 1; padding: 15px; border: none; background: none; color: white; cursor: pointer; font-size: 16px; transition: 0.3s; }
        .tab-btn.active { background: var(--secondary); font-weight: bold; }
        .tab-content { display: none; padding: 20px; }
        .tab-content.active { display: block; }

        /* Formulários */
        h2 { margin-top: 0; color: var(--primary); }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 14px; margin-bottom: 5px; color: #666; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        
        .btn { width: 100%; padding: 15px; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; margin-top: 10px; color: white; }
        .btn-calc { background: var(--secondary); }
        .btn-save { background: var(--primary); }

        /* Resultado */
        .result-box { margin-top: 20px; padding: 20px; background: #e8f5e9; border-left: 5px solid var(--secondary); border-radius: 4px; }
        .result-box h3 { margin: 0; font-size: 14px; color: #2e7d32; }
        .result-val { font-size: 24px; font-weight: bold; color: #1b5e20; }

        /* Lista de Materiais */
        .material-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee; }
        .material-info { font-size: 14px; }
        .actions button { margin-left: 5px; padding: 5px 10px; border-radius: 4px; border: none; cursor: pointer; }
        .edit-btn { background: #ffc107; }
        .del-btn { background: #f44336; color: white; }
    </style>
</head>
<body>

<div class="container">
    <div class="tabs">
        <button class="tab-btn active" onclick="openTab('calc')">Calculadora</button>
        <button class="tab-btn" onclick="openTab('mats')">Materiais</button>
    </div>

    <!-- ABA CALCULADORA -->
    <div id="calc" class="tab-content active">
        <h2>Orçamento</h2>
        <div class="form-group">
            <label>Material Selecionado</label>
            <select id="selMaterial"></select>
        </div>
        <div style="display: flex; gap: 10px;">
            <div class="form-group">
                <label>Largura Peça (cm)</label>
                <input type="number" id="lPeca" step="0.01">
            </div>
            <div class="form-group">
                <label>Altura Peça (cm)</label>
                <input type="number" id="aPeca" step="0.01">
            </div>
        </div>
        <div class="form-group">
            <label>Valor Hora Máquina (R$)</label>
            <input type="number" id="vHora" value="15.00">
        </div>
        <div class="form-group">
            <label>Tempo de Corte (minutos)</label>
            <input type="number" id="tMin">
        </div>
        <div class="form-group">
            <label>Adicionais / Acabamento (R$)</label>
            <input type="number" id="vAdd" value="0.00">
        </div>
        <button class="btn btn-calc" onclick="calcular()">Calcular Custo</button>

        <div id="resBox" class="result-box" style="display:none;">
            <h3>Custo Total Estimado</h3>
            <div class="result-val" id="resTotal">R$ 0,00</div>
        </div>
    </div>

    <!-- ABA MATERIAIS -->
    <div id="mats" class="tab-content">
        <h2 id="matTitle">Cadastrar Material</h2>
        <input type="hidden" id="editIdx" value="-1">
        <div class="form-group">
            <label>Nome do Material</label>
            <input type="text" id="mNome" placeholder="Ex: MDF 3mm">
        </div>
        <div class="form-group">
            <label>Preço da Placa Cheia (R$)</label>
            <input type="number" id="mPreco" step="0.01">
        </div>
        <div style="display: flex; gap: 10px;">
            <div class="form-group">
                <label>Largura Placa (cm)</label>
                <input type="number" id="mW" step="0.1">
            </div>
            <div class="form-group">
                <label>Altura Placa (cm)</label>
                <input type="number" id="mH" step="0.1">
            </div>
        </div>
        <button class="btn btn-save" onclick="saveMaterial()">Salvar Material</button>
        <button id="cancelBtn" class="btn" style="background:#666; display:none;" onclick="resetMatForm()">Cancelar Edição</button>

        <h2 style="margin-top:30px;">Meus Materiais</h2>
        <div id="listaMateriais"></div>
    </div>
</div>

<script>
    // Inicialização de Dados
    let materiais = JSON.parse(localStorage.getItem('laser_data')) || [
        {nome: "MDF Cru 3mm", preco: 6.00, w: 60, h: 40},
        {nome: "MDF Branco 1f", preco: 8.00, w: 60, h: 40},
        {nome: "Acrílico Rose 2mm", preco: 3.00, w: 20, h: 30}
    ];

    function openTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');
        if(tabId === 'calc') updateSelect();
        if(tabId === 'mats') renderMaterialList();
    }

    // Gerenciamento de Materiais
    function renderMaterialList() {
        const list = document.getElementById('listaMateriais');
        list.innerHTML = materiais.map((m, i) => `
            <div class="material-item">
                <div class="material-info">
                    <strong>${m.nome}</strong><br>
                    R$ ${m.preco.toFixed(2)} (${m.w}x${m.h}cm)
                </div>
                <div class="actions">
                    <button class="edit-btn" onclick="editMaterial(${i})">✏️</button>
                    <button class="del-btn" onclick="deleteMaterial(${i})">🗑️</button>
                </div>
            </div>
        `).join('');
    }

    function saveMaterial() {
        const idx = parseInt(document.getElementById('editIdx').value);
        const novoMat = {
            nome: document.getElementById('mNome').value,
            preco: parseFloat(document.getElementById('mPreco').value),
            w: parseFloat(document.getElementById('mW').value),
            h: parseFloat(document.getElementById('mH').value)
        };

        if(!novoMat.nome || isNaN(novoMat.preco)) return alert("Preencha os dados corretamente");

        if(idx === -1) {
            materiais.push(novoMat);
        } else {
            materiais[idx] = novoMat;
        }

        localStorage.setItem('laser_data', JSON.stringify(materiais));
        resetMatForm();
        renderMaterialList();
        alert("Salvo com sucesso!");
    }

    function editMaterial(i) {
        const m = materiais[i];
        document.getElementById('mNome').value = m.nome;
        document.getElementById('mPreco').value = m.preco;
        document.getElementById('mW').value = m.w;
        document.getElementById('mH').value = m.h;
        document.getElementById('editIdx').value = i;
        document.getElementById('matTitle').innerText = "Editando Material";
        document.getElementById('cancelBtn').style.display = "block";
        window.scrollTo(0,0);
    }

    function deleteMaterial(i) {
        if(confirm("Deseja excluir este material?")) {
            materiais.splice(i, 1);
            localStorage.setItem('laser_data', JSON.stringify(materiais));
            renderMaterialList();
        }
    }

    function resetMatForm() {
        document.getElementById('mNome').value = "";
        document.getElementById('mPreco').value = "";
        document.getElementById('mW').value = "";
        document.getElementById('mH').value = "";
        document.getElementById('editIdx').value = "-1";
        document.getElementById('matTitle').innerText = "Cadastrar Material";
        document.getElementById('cancelBtn').style.display = "none";
    }

    // Cálculo
    function updateSelect() {
        const sel = document.getElementById('selMaterial');
        sel.innerHTML = materiais.map((m, i) => `<option value="${i}">${m.nome}</option>`).join('');
    }

    function calcular() {
        const m = materiais[document.getElementById('selMaterial').value];
        const lp = parseFloat(document.getElementById('lPeca').value);
        const ap = parseFloat(document.getElementById('aPeca').value);
        const vh = parseFloat(document.getElementById('vHora').value);
        const tm = parseFloat(document.getElementById('tMin').value);
        const add = parseFloat(document.getElementById('vAdd').value) || 0;

        if(!m || isNaN(lp) || isNaN(ap) || isNaN(vh) || isNaN(tm)) {
            return alert("Por favor, preencha todos os campos obrigatórios.");
        }

        const areaPlaca = m.w * m.h;
        const areaPeca = lp * ap;
        const custoMat = (m.preco / areaPlaca) * areaPeca;
        const custoMaq = (vh / 60) * tm;
        const total = custoMat + custoMaq + add;

        document.getElementById('resTotal').innerText = `R$ ${total.toFixed(2)}`;
        document.getElementById('resBox').style.display = "block";
    }

    // Início
    updateSelect();
</script>
</body>
</html>
